[project]
name = "onpreo-agent-pro-poc"
version = "0.1.0"
description = "POC: Onpreo call-activity MCP server + Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "streamlit>=1.38",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
